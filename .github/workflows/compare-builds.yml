name: Compare PlatformIO Builds

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Show pio version
        run: pio --version

      - name: Prepare artifact dir
        run: mkdir -p $GITHUB_WORKSPACE/artifacts

      - name: Build controller_ws3p5_dev (verbose)
        working-directory: Wireless_Controller
        run: |
          pio run -e controller_ws3p5_dev -v > $GITHUB_WORKSPACE/artifacts/build_controller_ws3p5_dev.log 2>&1

      - name: Build controller_esp32_d0wdr2_dev (verbose)
        working-directory: Wireless_Controller
        run: |
          pio run -e controller_esp32_d0wdr2_dev -v > $GITHUB_WORKSPACE/artifacts/build_controller_esp32_d0wdr2_dev.log 2>&1

      - name: Collect firmware checksums
        run: |
          sha256sum Wireless_Controller/.pio/build/controller_ws3p5_dev/firmware.bin > $GITHUB_WORKSPACE/artifacts/firmware_controller_ws3p5_dev.sha256 || true
          sha256sum Wireless_Controller/.pio/build/controller_esp32_d0wdr2_dev/firmware.bin > $GITHUB_WORKSPACE/artifacts/firmware_controller_esp32_d0wdr2_dev.sha256 || true

      - name: Collect size outputs
        run: |
          pio run -C Wireless_Controller -e controller_ws3p5_dev -t size > $GITHUB_WORKSPACE/artifacts/size_controller_ws3p5_dev.txt || true
          pio run -C Wireless_Controller -e controller_esp32_d0wdr2_dev -t size > $GITHUB_WORKSPACE/artifacts/size_controller_esp32_d0wdr2_dev.txt || true

      - name: Extract warnings/errors
        run: |
          grep -i -E "warning:|error:" $GITHUB_WORKSPACE/artifacts/build_controller_ws3p5_dev.log | sed 's/^/A: /' > $GITHUB_WORKSPACE/artifacts/issues_controller_ws3p5_dev.txt || true
          grep -i -E "warning:|error:" $GITHUB_WORKSPACE/artifacts/build_controller_esp32_d0wdr2_dev.log | sed 's/^/B: /' > $GITHUB_WORKSPACE/artifacts/issues_controller_esp32_d0wdr2_dev.txt || true

      - name: Save compiler -D flags
        run: |
          grep -o -- "-D[^ ]*" $GITHUB_WORKSPACE/artifacts/build_controller_ws3p5_dev.log | sort -u > $GITHUB_WORKSPACE/artifacts/flags_controller_ws3p5_dev.txt || true
          grep -o -- "-D[^ ]*" $GITHUB_WORKSPACE/artifacts/build_controller_esp32_d0wdr2_dev.log | sort -u > $GITHUB_WORKSPACE/artifacts/flags_controller_esp32_d0wdr2_dev.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compare-builds-artifacts
          path: artifacts/
